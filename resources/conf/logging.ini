[loggers]
keys=root

[handlers]
keys=fileHandler,consoleHandler

[filters]
keys=sessioncontext

[filter_sessioncontext]
class=logutils.filters.ContextFilter

[formatters]
keys=saferFormatter,simpleFormatter

[logger_root]
level=INFO
handlers=fileHandler,consoleHandler
propagate=0

[handler_fileHandler]
class=handlers.TimedRotatingFileHandler
formatter=saferFormatter
filters=sessioncontext
args=('%(agent_log_file)s', 'midnight', 1, 30, 'utf-8')

[handler_consoleHandler]
class=StreamHandler
formatter=simpleFormatter
args=(sys.stdout,)

[formatter_saferFormatter]
class=logging.Formatter
format=%(asctime)s | %(levelname)-8s | %(name)s | %(filename)s:%(lineno)d | %(message)s

[formatter_simpleFormatter]
class=logging.Formatter
format=%(asctime)s | %(levelname)-8s | %(name)s | %(filename)s:%(lineno)d | %(message)s

[logger_rabbit_agent]
level=DEBUG
handlers=fileHandler,consoleHandler
qualname=rabbit_agent
propagate=0

[handler_console]
class=StreamHandler
level=INFO
formatter=standard
args=(sys.stdout,)

[handler_file]
class=handlers.TimedRotatingFileHandler
level=DEBUG
formatter=standard
args=('%(agent_log_file)s', 'midnight', 1, 30, 'utf-8')

[formatter_standard]
format=%(asctime)s | %(levelname)-8s | %(name)s | %(filename)s:%(lineno)d | %(message)s
datefmt=%Y-%m-%d %H:%M:%S
class=logging.Formatter