; RabbitAgent 日志配置
;
; 由 ``domains.configuration.infrastructure.logging_bootstrap`` 通过
; ``logging.config.fileConfig`` 加载，``%(agent_log_file)s`` 由 bootstrap 注入为
; ``shared.paths.get_log_file()`` 的实际路径。
;
; 说明：此前本仓库缺少 ``conf/`` 目录，``logging.ini`` 不存在，于是
; ``fileConfig`` 从未被调用 —— root logger 没有任何文件 handler，
; 所有 ``logger.exception`` / ``logger.error`` 的堆栈**全部丢失**，
; TUI 里只能看到 spinner，既无法定位失败原因，也无法事后复盘。
; 本文件只用标准库 logging 的类，不依赖项目外的 ``logutils`` / ``handlers``。

[loggers]
keys=root

[handlers]
keys=fileHandler,consoleHandler

[formatters]
keys=saferFormatter,simpleFormatter

[logger_root]
level=INFO
handlers=fileHandler,consoleHandler
propagate=0

[handler_fileHandler]
class=handlers.TimedRotatingFileHandler
level=INFO
formatter=saferFormatter
args=('%(agent_log_file)s', 'midnight', 1, 30, 'utf-8')

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simpleFormatter
args=(sys.stdout,)

[formatter_saferFormatter]
class=logging.Formatter
format=%(asctime)s | %(levelname)-8s | %(name)s | %(filename)s:%(lineno)d | %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_simpleFormatter]
class=logging.Formatter
format=%(asctime)s | %(levelname)-8s | %(name)s | %(filename)s:%(lineno)d | %(message)s
datefmt=%Y-%m-%d %H:%M:%S
